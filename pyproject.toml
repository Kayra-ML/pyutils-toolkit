[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pyutils-toolkit"
version = "0.1.0"
description = "A lightweight Python utility library for common data processing tasks."
authors = [{ name = "Kayra-ML" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["utilities", "toolkit", "helpers", "string", "datetime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Kayra-ML/pyutils-toolkit"
Issues = "https://github.com/Kayra-ML/pyutils-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyutils*"]